<text x="28" y="42" font-size="21" font-weight="700" fill="#161b22">ProyectoTIS: un productor guardado = un esquema PostgreSQL</text>
<text x="28" y="66" font-size="13" fill="#5b6675">Django 2.0.8 + django-tenants 2.0.0 sobre PostgreSQL 9.6.24. Una sola base de datos (tendencias), un esquema por productor.</text>
<text x="28" y="106" font-size="11.5" font-weight="700" fill="#5b6675" letter-spacing="0.6">DOMINIO QUE ATIENDE</text>
<text x="330" y="106" font-size="11.5" font-weight="700" fill="#5b6675" letter-spacing="0.6">ESQUEMA EN POSTGRESQL</text>
<text x="620" y="106" font-size="11.5" font-weight="700" fill="#5b6675" letter-spacing="0.6">TABLAS</text>
<text x="742" y="106" font-size="11.5" font-weight="700" fill="#5b6675" letter-spacing="0.6">GESTIONFRUTA_FRUTA</text>
