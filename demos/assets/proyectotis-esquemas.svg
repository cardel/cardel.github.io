<text x="756" y="381" font-size="11.5" fill="#5b6675">filas</text>
<text x="28" y="446" font-size="12.5" fill="#5b6675">El esquema public no tiene ninguna tabla gestionfruta_*: los datos de cada finca solo existen dentro de su esquema.</text>
<text x="28" y="468" font-size="12.5" fill="#5b6675">El mismo servidor y la misma URL /fruta/ devuelven contenido distinto segun el dominio del Host.</text>
