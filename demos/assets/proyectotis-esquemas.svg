<text x="330" y="172" font-size="11.5" fill="#5b6675">esquema compartido: productores y dominios</text>
<text x="620" y="159" font-size="19" font-weight="700" fill="#161b22">14</text>
<text x="652" y="159" font-size="11.5" fill="#5b6675">tablas</text>
<text x="742" y="162" font-size="12.5" fill="#5b6675" font-family="ui-monospace, Menlo, Consolas, monospace">la tabla no existe</text>
<rect x="28" y="202" width="884" height="58" rx="9" fill="#eef6f2" stroke="#d3d9e2" stroke-width="1.2"/>
<rect x="28" y="202" width="5" height="58" rx="2.5" fill="#0f7b6c"/>
